<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 175 48" width="175" height="48">
  <!-- Shopping Bag / Cart Emblem -->
  <g transform="translate(4, 7)">
    <rect x="3" y="10" width="26" height="24" rx="6" fill="#2563EB" />
    <path d="M10 10 V7 a6 6 0 0 1 12 0 v3" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Smile in the bag -->
    <path d="M10 22 C12 26, 20 26, 22 22" stroke="#FF9900" stroke-width="2.5" stroke-linecap="round" fill="none" />
  </g>
  <!-- Brand Name Typography -->
  <text x="42" y="32" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="900" letter-spacing="-0.5" fill="#0F172A">
    Buy<tspan fill="#2563EB">It</tspan>
  </text>
  <!-- Smile swoosh arrow under text -->
  <path d="M 44 40 C 72 49, 110 49, 134 40" fill="none" stroke="#FF9900" stroke-width="3" stroke-linecap="round" />
  <path d="M 130 43.5 L 137 39.5 L 133 34.5 Z" fill="#FF9900" />
</svg>
